services:
  cluster-hub:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      PORT: ${PORT:-3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file}
      CLUSTER_HUB_DOCKER_NETWORK: host
      WOL_BROADCASTS: ${WOL_BROADCASTS:-}
      WOL_PORTS: ${WOL_PORTS:-}
    volumes:
      - cluster-hub-data:/app/data
    restart: unless-stopped

volumes:
  cluster-hub-data:
